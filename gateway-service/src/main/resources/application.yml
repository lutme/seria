server:
  port: 7085
spring:
  application:
    name: gateway-service
  # 读取指定 Nacos 配置中心配置
  config:
    # gateway-routes.yaml 配置文件名称(带文件类型)
    # group 所属分组
    # refreshEnabled 支持动态刷新
    import:
      - "nacos:gateway-routes.yaml?group=DEFAULT_GROUP"
      - "nacos:gateway-stamp.yaml?group=DEFAULT_GROUP"
      - "nacos:jwt.yaml?group=DEFAULT_GROUP"
      - "nacos:redis.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      # Nacos 服务注册
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+
      # Nacos 配置中心
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+