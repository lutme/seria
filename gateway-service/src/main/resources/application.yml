server:
  port: 8085
# 自定义染色器 token 配置 gateway 进行请求染色
security:
  gateway:
    # 一段足够长的随机密钥
    token: 24b2aa37ab6dfefc3e87dc59ee7c6479
app:
  security:
    jwt:
      secret-base64: 3AvTkRpMQbRqHJvB3pMwyzaaRip1SnIFQkXp8HSWykk=
      expiration-minutes: 30
    whitelist:
      - /consumer/auth/login
      - /actuator/health
spring:
  application:
    name: gateway-service
  # 读取指定 Nacos 配置中心配置
  config:
    # gateway-routes.yaml 配置文件名称(带文件类型)
    # group 所属分组
    # refreshEnabled 支持动态刷新
    import:
      - "nacos:gateway-routes.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      # Nacos 服务注册
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+
      # Nacos 配置中心
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+