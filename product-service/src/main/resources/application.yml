server:
  port: 7093
# 雪花 id 配置
snowflake:
  worker-id: 2
  datacenter-id: 1
# gateway 请求染色校验开启参数(本地测试可以设置为 false 避免关联 gateway)
gateway:
  stamp:
    enabled: true
spring:
  application:
    name: product-service
  # 读取指定 Nacos 配置中心配置
  config:
    # service-provider.yaml 配置文件名称(带文件类型)
    # group 所属分组
    # refreshEnabled 支持动态刷新
    import:
      - "nacos:gateway-stamp.yaml?group=DEFAULT_GROUP"
      - "nacos:product-mysql.yaml?group=DEFAULT_GROUP"
  cloud:
    nacos:
      # Nacos 服务注册
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+
      # Nacos 配置中心
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+