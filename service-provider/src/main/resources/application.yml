server:
  port: 7089
# 雪花 id 配置
snowflake:
  worker-id: 1
  datacenter-id: 1

# 自定义染色器 token 配置 gateway 进行请求染色
security:
  gateway:
    # 一段足够长的随机密钥
    token: 24b2aa37ab6dfefc3e87dc59ee7c6479
spring:
  application:
    name: service-provider
  # 读取指定 Nacos 配置中心配置
  config:
    # service-provider.yaml 配置文件名称(带文件类型)
    # group 所属分组
    # refreshEnabled 支持动态刷新
    import:
      - "nacos:service-provider.yaml?group=DEFAULT_GROUP&refreshEnabled=true"
  cloud:
    nacos:
      # Nacos 服务注册
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+
      # Nacos 配置中心
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: 1230.+